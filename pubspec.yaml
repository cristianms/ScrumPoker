name: scrumpoker
description: ScrumPoker
version: 1.0.1+2
environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  # Minhas dependências
  http: ^1.6.0
  shared_preferences: ^2.0.5
  firebase_core: ^4.9.0
  firebase_auth: ^6.5.1
  firebase_storage: ^13.4.1
  google_sign_in: ^7.2.0
  cloud_firestore: ^6.4.1
  image_picker: ^1.2.1
  provider: ^5.0.0
  responsive_grid: ^2.2.0
  cached_network_image: ^3.2.3
  share_plus: ^12.0.1
  clipboard: ^0.1.3
  flutter_speed_dial: ^6.2.0
  google_sign_in_web: ^1.1.3
  flutter_native_splash: ^2.4.7
  flutter_launcher_icons: ^0.14.4
  connectivity_plus: ^7.0.0
dev_dependencies:
  flutter_lints: ^2.0.1
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/imagens/
    - assets/imagens/scrumpoker_icon.png
    - assets/imagens/scrumpoker_icon_grande.png
  fonts:
    - family: Pacifico
      fonts:
        - asset: fonts/Pacifico-Regular.ttf
    - family: Raleway
      fonts:
        - asset: fonts/Raleway-Regular.ttf
        - asset: fonts/Raleway-Italic.ttf
          style: italic
    - family: Roboto
      fonts:
        - asset: fonts/Roboto-Regular.ttf
        - asset: fonts/Roboto-Bold.ttf
          weight: 700
    - family: RobotoMono
      fonts:
        - asset: fonts/RobotoMono-Regular.ttf
        - asset: fonts/RobotoMono-Bold.ttf
          weight: 700

flutter_native_splash:
  image: "assets/imagens/scrumpoker_icon_grande.png"
  color: "ffffff"
  android_disable_fullscreen: true

flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/imagens/scrumpoker_icon_grande.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  web:
    generate: true
    image_path: "assets/imagens/scrumpoker_icon_grande.png"
    background_color: "#ffffff"
    theme_color: "#ffffff"
  windows:
    generate: true
    image_path: "assets/imagens/scrumpoker_icon_grande.png"
    icon_size: 48 # min:48, max:256, default: 48
  macos:
    generate: true
    image_path: "assets/imagens/scrumpoker_icon_grande.png"
